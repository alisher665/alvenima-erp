<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vosk Test</title>
</head>
<body style="background:#000;color:#fff;text-align:center;padding-top:50px;font-family:sans-serif;">
<h2>Тест Vosk</h2>
<button id="btn" disabled style="padding:20px;font-size:20px;background:gray;color:#fff;border:none;border-radius:10px;">
    ЖДИТЕ ЗАГРУЗКИ...
</button>
<p id="status" style="font-size:18px;color:yellow;">Ожидание...</p>

<script>
    var btn = document.getElementById('btn');
    var status = document.getElementById('status');
    var isReady = false;

    window.onModelLoaded = function() {
        isReady = true;
        btn.disabled = false;
        btn.style.background = 'blue';
        btn.innerText = 'НАЖМИ МЕНЯ';
        status.innerText = 'Модель готова!';
    };

    btn.onclick = function() {
        if (!isReady) return;

        if (btn.innerText === 'НАЖМИ МЕНЯ') {
            status.innerText = 'Слушаю...';
            btn.innerText = 'ОСТАНОВИТЬ';
            btn.style.background = 'red';
            if (window.AndroidApp) window.AndroidApp.startVosk();
        } else {
            status.innerText = 'Обработка...';
            btn.innerText = 'НАЖМИ МЕНЯ';
            btn.style.background = 'blue';
            if (window.AndroidApp) window.AndroidApp.stopVosk();
        }
    };

    window.onVoskResult = function(text) {
        if (text && text.trim() !== "") {
            status.style.color = 'lightgreen';
            status.innerText = 'Вы сказали: ' + text;
            document.getElementById('work-name').value = text;
        } else {
            status.innerText = 'Ничего не распознано.';
        }
    };
</script>
</body>
</html>
